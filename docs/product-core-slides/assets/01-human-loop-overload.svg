<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">人类回路过载</title>
  <desc id="desc">智能体产生上下文的速度，超过了人类审查节点能处理的速度。</desc>
  <defs>
    <style>
      .bg { fill: #fbfaf7; }
      .ink { stroke: #1f2937; }
      .soft { stroke: #8a93a1; }
      .blue { stroke: #3b82f6; }
      .amber { stroke: #f59e0b; }
      .red { stroke: #ef4444; }
      .green { stroke: #10b981; }
      .fill-blue { fill: #dbeafe; }
      .fill-amber { fill: #fef3c7; }
      .fill-red { fill: #fee2e2; }
      .fill-green { fill: #d1fae5; }
      .fill-white { fill: #ffffff; }
      .text { fill: #1f2937; font: 600 28px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: #4b5563; font: 500 18px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .line { fill: none; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="680"/>

  <text class="text" x="84" y="76">智能体速度快过人的注意力</text>
  <text class="small" x="86" y="112">人还在负责判断，但审查节点已经过载。</text>

  <g transform="translate(86 210)">
    <rect class="fill-blue ink" x="0" y="0" width="168" height="96" rx="18" stroke-width="4"/>
    <path class="line blue" d="M46 64 C52 24 116 24 122 64"/>
    <path class="thin blue" d="M56 66 H112 M64 48 H104 M78 32 H90"/>
    <text class="small" x="48" y="132">智能体</text>
  </g>

  <g transform="translate(338 185)">
    <rect class="fill-white soft" x="0" y="0" width="210" height="52" rx="13" stroke-width="3"/>
    <rect class="fill-white soft" x="0" y="72" width="210" height="52" rx="13" stroke-width="3"/>
    <rect class="fill-white soft" x="0" y="144" width="210" height="52" rx="13" stroke-width="3"/>
    <path class="thin blue" d="M28 26 H176 M28 98 H176 M28 170 H176"/>
    <path class="thin soft" d="M28 39 H126 M28 111 H144 M28 183 H116"/>
    <text class="small" x="47" y="242">文件、工具、测试</text>
  </g>

  <path class="line blue" marker-end="url(#arrow-blue)" d="M270 258 C305 250 312 250 338 250"/>
  <path class="line blue" marker-end="url(#arrow-blue)" d="M548 250 C602 250 626 250 676 250"/>
  <path class="line blue" marker-end="url(#arrow-blue)" d="M548 326 C610 326 636 308 682 292"/>

  <g transform="translate(700 205)">
    <circle class="fill-amber ink" cx="122" cy="72" r="58" stroke-width="4"/>
    <path class="line amber" d="M92 70 C90 46 112 36 124 50 C140 32 166 48 152 74 C164 92 144 112 126 96 C106 116 80 94 92 70Z"/>
    <path class="thin ink" d="M122 130 V174"/>
    <path class="thin ink" d="M82 196 C104 166 144 166 166 196"/>
    <text class="small" x="52" y="240">人类审查者</text>
  </g>

  <g transform="translate(935 188)">
    <rect class="fill-red red" x="0" y="0" width="150" height="46" rx="23" stroke-width="3"/>
    <rect class="fill-red red" x="14" y="64" width="122" height="46" rx="23" stroke-width="3"/>
    <rect class="fill-green green" x="31" y="128" width="88" height="46" rx="23" stroke-width="3"/>
    <text class="small" x="28" y="30">上下文</text>
    <text class="small" x="40" y="94">风险</text>
    <text class="small" x="42" y="158">确认?</text>
  </g>

  <path class="line amber" marker-end="url(#arrow)" d="M862 280 C900 244 910 228 935 214"/>
  <path class="line amber" marker-end="url(#arrow)" d="M866 292 C906 292 914 290 935 282"/>
  <path class="line amber" marker-end="url(#arrow)" d="M856 312 C898 346 914 350 966 342"/>

  <g transform="translate(246 510)">
    <path class="thin soft" d="M0 42 H710"/>
    <circle class="fill-blue blue" cx="80" cy="42" r="13" stroke-width="3"/>
    <circle class="fill-blue blue" cx="220" cy="42" r="13" stroke-width="3"/>
    <circle class="fill-blue blue" cx="360" cy="42" r="13" stroke-width="3"/>
    <circle class="fill-amber amber" cx="630" cy="42" r="23" stroke-width="3"/>
    <text class="small" x="24" y="88">机器速度</text>
    <text class="small" x="553" y="88">人的速度</text>
  </g>
</svg>
