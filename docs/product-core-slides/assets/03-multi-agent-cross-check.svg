<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">多智能体互相检查</title>
  <desc id="desc">规划者、实现者、评审者和总结者围绕同一份证据协作，再由人做决定。</desc>
  <defs>
    <style>
      .bg { fill: #fbfaf7; }
      .ink { stroke: #1f2937; }
      .soft { stroke: #8a93a1; }
      .blue { stroke: #3b82f6; }
      .green { stroke: #10b981; }
      .amber { stroke: #f59e0b; }
      .violet { stroke: #8b5cf6; }
      .fill-white { fill: #ffffff; }
      .fill-blue { fill: #dbeafe; }
      .fill-green { fill: #d1fae5; }
      .fill-amber { fill: #fef3c7; }
      .fill-violet { fill: #ede9fe; }
      .text { fill: #1f2937; font: 600 28px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: #4b5563; font: 500 18px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .line { fill: none; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="680"/>
  <text class="text" x="84" y="76">多智能体的价值在分工，不在更多答案</text>
  <text class="small" x="86" y="112">它们先互相检查，把问题整理清楚，人再做关键决定。</text>

  <g transform="translate(460 214)">
    <rect class="fill-white ink" x="0" y="0" width="280" height="180" rx="22" stroke-width="4"/>
    <path class="thin soft" d="M44 48 H236 M44 86 H188 M44 124 H218"/>
    <circle class="fill-amber amber" cx="228" cy="134" r="18" stroke-width="3"/>
    <path class="thin amber" d="M219 134 L226 142 L240 125"/>
    <text class="small" x="68" y="222">共享证据</text>
  </g>

  <g transform="translate(146 170)">
    <circle class="fill-blue blue" cx="86" cy="70" r="54" stroke-width="4"/>
    <path class="thin blue" d="M58 72 H114 M68 54 H104 M68 90 H92"/>
    <text class="small" x="48" y="150">规划者</text>
  </g>

  <g transform="translate(154 410)">
    <circle class="fill-green green" cx="86" cy="70" r="54" stroke-width="4"/>
    <path class="thin green" d="M58 74 L76 92 L118 50"/>
    <text class="small" x="48" y="150">实现者</text>
  </g>

  <g transform="translate(900 170)">
    <circle class="fill-amber amber" cx="86" cy="70" r="54" stroke-width="4"/>
    <path class="thin amber" d="M58 58 H116 M58 78 H96 M58 98 H108"/>
    <circle class="fill-white amber" cx="116" cy="98" r="14" stroke-width="3"/>
    <text class="small" x="48" y="150">评审者</text>
  </g>

  <g transform="translate(890 410)">
    <circle class="fill-violet violet" cx="86" cy="70" r="54" stroke-width="4"/>
    <path class="thin violet" d="M60 56 H112 M60 74 H112 M72 96 H100"/>
    <text class="small" x="44" y="150">总结者</text>
  </g>

  <path class="line ink" marker-end="url(#arrow)" d="M286 238 C360 224 396 220 456 246"/>
  <path class="line ink" marker-end="url(#arrow)" d="M292 478 C372 470 402 438 460 368"/>
  <path class="line ink" marker-end="url(#arrow)" d="M896 238 C816 224 786 220 744 246"/>
  <path class="line ink" marker-end="url(#arrow)" d="M888 478 C806 466 782 430 740 368"/>
  <path class="thin soft" marker-end="url(#arrow)" d="M270 414 C406 306 778 300 920 414"/>
  <path class="thin soft" marker-end="url(#arrow)" d="M920 266 C780 378 406 382 270 266"/>

  <g transform="translate(488 500)">
    <path class="line ink" d="M0 0 C22 48 202 48 224 0"/>
    <circle class="fill-white ink" cx="112" cy="84" r="38" stroke-width="4"/>
    <path class="thin ink" d="M112 122 V162 M84 176 C102 154 122 154 140 176"/>
    <text class="small" x="54" y="214">人做决定</text>
  </g>
</svg>
