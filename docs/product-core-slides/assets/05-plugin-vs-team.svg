<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">插件方案与智能体团队对比</title>
  <desc id="desc">Codex 审查插件增强以 Claude 为中心的流程，而 Silverhand 让多个智能体成为对等协作者。</desc>
  <defs>
    <style>
      .bg { fill: #fbfaf7; }
      .ink { stroke: #1f2937; }
      .soft { stroke: #8a93a1; }
      .blue { stroke: #3b82f6; }
      .green { stroke: #10b981; }
      .amber { stroke: #f59e0b; }
      .red { stroke: #ef4444; }
      .fill-white { fill: #ffffff; }
      .fill-blue { fill: #dbeafe; }
      .fill-green { fill: #d1fae5; }
      .fill-amber { fill: #fef3c7; }
      .fill-red { fill: #fee2e2; }
      .text { fill: #1f2937; font: 600 28px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: #4b5563; font: 500 18px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { fill: #1f2937; font: 700 20px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .line { fill: none; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .dash { stroke-dasharray: 10 12; }
    </style>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="680"/>
  <text class="text" x="84" y="76">审查插件增强一个智能体；Silverhand 组织协作</text>
  <text class="small" x="86" y="112">两者都有用，但解决的是不同层级的问题。</text>

  <g transform="translate(80 178)">
    <rect class="fill-white ink" x="0" y="0" width="500" height="386" rx="28" stroke-width="4"/>
    <text class="label" x="36" y="50">Claude + 审查插件</text>
    <circle class="fill-blue blue" cx="148" cy="170" r="62" stroke-width="4"/>
    <text class="small" x="112" y="258">Claude</text>
    <rect class="fill-amber amber" x="290" y="122" width="140" height="94" rx="18" stroke-width="3"/>
    <text class="small" x="334" y="162">Codex</text>
    <text class="small" x="322" y="190">插件</text>
    <path class="line ink" marker-end="url(#arrow)" d="M210 170 H288"/>
    <path class="thin soft dash" d="M356 216 C328 278 252 304 180 230"/>
    <text class="small" x="64" y="330">单中心 · 工具式审查</text>
  </g>

  <g transform="translate(620 178)">
    <rect class="fill-white ink" x="0" y="0" width="500" height="386" rx="28" stroke-width="4"/>
    <text class="label" x="36" y="50">Silverhand 智能体团队</text>
    <circle class="fill-blue blue" cx="130" cy="142" r="48" stroke-width="4"/>
    <circle class="fill-green green" cx="252" cy="118" r="48" stroke-width="4"/>
    <circle class="fill-amber amber" cx="370" cy="154" r="48" stroke-width="4"/>
    <circle class="fill-red red" cx="248" cy="268" r="48" stroke-width="4"/>
    <path class="thin ink" d="M174 132 L208 124 M296 130 L326 144 M344 194 L286 242 M210 246 L166 178 M160 178 L214 242 M292 238 L338 194"/>
    <rect class="fill-white soft" x="160" y="174" width="178" height="72" rx="16" stroke-width="3"/>
    <path class="thin soft" d="M192 200 H306 M192 220 H276"/>
    <text class="small" x="98" y="330">对等成员 · 共享上下文</text>
  </g>

  <path class="line soft" d="M600 214 V538"/>
  <text class="small" x="565" y="586">工具</text>
  <text class="small" x="622" y="586">团队</text>
</svg>
