<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">单个智能体的思路惯性</title>
  <desc id="desc">单个智能体会沿着自己的路径继续修补，因为缺少外部视角来检查。</desc>
  <defs>
    <style>
      .bg { fill: #fbfaf7; }
      .ink { stroke: #1f2937; }
      .soft { stroke: #8a93a1; }
      .red { stroke: #ef4444; }
      .blue { stroke: #3b82f6; }
      .amber { stroke: #f59e0b; }
      .fill-white { fill: #ffffff; }
      .fill-blue { fill: #dbeafe; }
      .fill-amber { fill: #fef3c7; }
      .fill-red { fill: #fee2e2; }
      .text { fill: #1f2937; font: 600 28px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: #4b5563; font: 500 18px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .line { fill: none; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .dash { stroke-dasharray: 12 12; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="680"/>
  <text class="text" x="84" y="76">单个智能体也会困在自己的思路里</text>
  <text class="small" x="86" y="112">问题不是能力不够，而是没人从另一个角度检查它。</text>

  <g transform="translate(105 270)">
    <circle class="fill-blue ink" cx="86" cy="76" r="64" stroke-width="4"/>
    <path class="line blue" d="M52 82 C60 38 112 34 126 76"/>
    <path class="thin blue" d="M62 86 H118 M72 66 H108"/>
    <text class="small" x="34" y="170">单个智能体</text>
  </g>

  <path class="line blue" marker-end="url(#arrow-blue)" d="M276 348 C372 242 514 220 626 268"/>
  <path class="line blue" marker-end="url(#arrow-blue)" d="M626 268 C774 332 756 466 610 486"/>
  <path class="line blue" marker-end="url(#arrow-blue)" d="M610 486 C470 506 398 436 438 350"/>
  <path class="line blue" marker-end="url(#arrow-blue)" d="M438 350 C474 274 558 268 626 268"/>

  <g transform="translate(515 246)">
    <rect class="fill-white soft" x="0" y="0" width="170" height="76" rx="17" stroke-width="3"/>
    <path class="thin soft" d="M30 28 H138 M30 48 H106"/>
    <text class="small" x="42" y="116">初始假设</text>
  </g>

  <g transform="translate(710 416)">
    <rect class="fill-amber amber" x="0" y="0" width="146" height="52" rx="16" stroke-width="3"/>
    <path class="thin amber" d="M30 26 H116"/>
    <text class="small" x="20" y="92">继续补丁</text>
  </g>

  <g transform="translate(360 430)">
    <rect class="fill-red red" x="0" y="0" width="142" height="52" rx="16" stroke-width="3"/>
    <path class="thin red" d="M32 16 L110 42 M110 16 L32 42"/>
    <text class="small" x="18" y="92">方向偏移</text>
  </g>

  <g transform="translate(900 246)">
    <rect class="fill-white ink" x="0" y="0" width="178" height="138" rx="18" stroke-width="4"/>
    <path class="line red" d="M42 40 H136"/>
    <path class="line red" d="M42 76 H136"/>
    <path class="line red" d="M42 112 H136"/>
    <text class="small" x="36" y="178">没人检查</text>
  </g>

  <path class="line red dash" marker-end="url(#arrow-red)" d="M888 312 C808 318 762 310 706 282"/>

  <g transform="translate(190 540)">
    <rect class="fill-white soft" x="0" y="0" width="820" height="68" rx="18" stroke-width="3"/>
    <text class="small" x="36" y="43">自己评自己，常会越写越像对的。</text>
  </g>
</svg>
