<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>list-sort drag mockup — 拖拽闪烁定位</title>
<!-- 固定一份 React 实例，dnd-kit 用 ?external 复用它，避免双 React 崩溃 -->
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime"
  }
}
</script>
<style>
  :root {
    --bg: #1f2125;
    --panel: #26282d;
    --row: #2c2f35;
    --row-hover: #34373e;
    --row-selected: #3a5bd9;
    --text: #d6d9df;
    --text-muted: #8a8f99;
    --border: #3a3d44;
    --accent: #5b7cfa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  h1 { font-size: 15px; margin: 0 0 4px; }
  p.lede { color: var(--text-muted); margin: 0 0 16px; max-width: 640px; }
  .layout { display: flex; gap: 32px; align-items: flex-start; }
  .controls {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    width: 360px;
    flex-shrink: 0;
  }
  .controls h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); margin: 0 0 10px; }
  .toggle { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--border); }
  .toggle:first-of-type { border-top: none; }
  .toggle input { margin-top: 2px; width: 16px; height: 16px; flex-shrink: 0; }
  .toggle .body { min-width: 0; }
  .toggle .name { font-weight: 600; }
  .toggle .desc { color: var(--text-muted); font-size: 12px; }
  .sidebar {
    width: 240px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px;
    flex-shrink: 0;
  }
  .sidebar h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); margin: 4px 6px 8px; }
  ul.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  /* 行：与 ChannelsSidebar 的 ChannelRow 一致——transition-colors，hover/selected 改色 */
  li.row {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 10px;
    border: 1px solid transparent;
    border-radius: 6px;
    background: var(--row);
    color: var(--text);
    cursor: grab;
    user-select: none;
    transition: background-color .12s, border-color .12s, color .12s;
  }
  li.row:hover { background: var(--row-hover); border-color: var(--accent); }
  li.row.selected { background: var(--row-selected); border-color: var(--accent); color: #fff; }
  li.row:active { cursor: grabbing; }
  li.row .hash { color: var(--text-muted); }
  .touch-none { touch-action: none; }
  .log {
    margin-top: 14px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px; color: var(--text-muted); white-space: pre-wrap;
    max-height: 160px; overflow: auto; border-top: 1px solid var(--border); padding-top: 8px;
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="module">
import React, { useState, useRef } from 'react';
import { createRoot } from 'react-dom/client';
import htm from 'https://esm.sh/htm@3.1.1';
import {
  DndContext, KeyboardSensor, PointerSensor,
  closestCenter, useSensor, useSensors,
} from 'https://esm.sh/@dnd-kit/core@6.1.0?external=react,react-dom';
import {
  restrictToParentElement, restrictToVerticalAxis,
} from 'https://esm.sh/@dnd-kit/modifiers@7.0.0?external=react,react-dom&deps=@dnd-kit/core@6.1.0';
import {
  SortableContext, arrayMove, defaultAnimateLayoutChanges,
  sortableKeyboardCoordinates, useSortable, verticalListSortingStrategy,
} from 'https://esm.sh/@dnd-kit/sortable@8.0.0?external=react,react-dom&deps=@dnd-kit/core@6.1.0';

const html = htm.bind(React.createElement);

const INITIAL = [
  { id: 'c1', title: 'general' },
  { id: 'c2', title: 'design-review' },
  { id: 'c3', title: 'frontend' },
  { id: 'c4', title: 'backend' },
  { id: 'c5', title: 'incidents' },
  { id: 'c6', title: 'random' },
  { id: 'c7', title: 'releases' },
];

function SortableItem({ item, selected, onSelect, opts }) {
  // 默认（修复版）：拖拽中 isSorting=true 保留相邻行平滑让位；松手 settle 关掉。
  // 打开「settle 动画」开关 → 永远走 default（即旧的会“跳一下”的版本）。
  const animateLayoutChanges = (args) =>
    opts.settle ? defaultAnimateLayoutChanges(args)
                : (args.isSorting ? defaultAnimateLayoutChanges(args) : false);

  const { setNodeRef, transform, transition, isDragging, attributes, listeners } =
    useSortable({ id: item.id, animateLayoutChanges });

  const style = {
    transform: transform ? `translate3d(0, ${transform.y}px, 0)` : undefined,
    transition,
    // 打开「dim 拖拽行」开关 → 拖拽行 opacity 0.5，松手瞬间弹回 1（疑似闪烁源）
    opacity: opts.dim && isDragging ? 0.5 : undefined,
    zIndex: isDragging ? 1 : undefined,
    position: isDragging ? 'relative' : undefined,
  };

  return html`
    <li
      ref=${setNodeRef}
      style=${style}
      class=${'row touch-none' + (selected ? ' selected' : '')}
      onClick=${() => onSelect(item.id)}
      ...${attributes}
      ...${listeners}
    >
      <span class="hash">#</span>
      <span class="title">${item.title}</span>
    </li>`;
}

function App() {
  const [items, setItems] = useState(INITIAL);
  const [selected, setSelected] = useState('c3');
  const [opts, setOpts] = useState({ dim: false, reconcile: false, settle: false });
  const [log, setLog] = useState('就绪。拖一行试试，下面会记录每次 drop 与模拟的重渲染。');
  const tickRef = useRef(0);

  const sensors = useSensors(
    useSensor(PointerSensor, { activationConstraint: { distance: 4 } }),
    useSensor(KeyboardSensor, { coordinateGetter: sortableKeyboardCoordinates }),
  );

  const append = (line) => setLog((prev) => (prev + '\n' + line).split('\n').slice(-12).join('\n'));

  const onDragEnd = ({ active, over }) => {
    if (!over || active.id === over.id) return;
    const ids = items.map((i) => i.id);
    const oldIndex = ids.indexOf(String(active.id));
    const newIndex = ids.indexOf(String(over.id));
    if (oldIndex < 0 || newIndex < 0) return;

    // 同步乐观重排（= 真实代码里的 useApplySortOrder）
    const next = arrayMove(items, oldIndex, newIndex);
    setItems(next);
    append(`drop: ${active.id} → index ${newIndex}（同步重排）`);

    // 模拟「后端响应回来后 setQueryData 对账」——新对象 ref、~150ms 后再 render 一次
    if (opts.reconcile) {
      const tick = ++tickRef.current;
      setTimeout(() => {
        setItems((prev) => prev.map((it) => ({ ...it }))); // 全新 ref → 触发整列重渲染
        append(`  ↳ +150ms 模拟后端对账重渲染 #${tick}`);
      }, 150);
    }
  };

  const Toggle = ({ k, name, desc }) => html`
    <label class="toggle">
      <input
        type="checkbox"
        checked=${opts[k]}
        onChange=${(e) => setOpts((o) => ({ ...o, [k]: e.target.checked }))}
      />
      <span class="body">
        <span class="name">${name}</span><br/>
        <span class="desc">${desc}</span>
      </span>
    </label>`;

  return html`
    <div>
      <h1>list-sort drag mockup</h1>
      <p class="lede">
        与 ChannelsSidebar 完全相同的拖拽写法（同一套 dnd-kit useSortable + translate3d +
        animateLayoutChanges 守卫 + 同步乐观重排）。三个开关默认 <b>全关 = 我当前的修复版</b>，
        理论上松手即原地静止。逐个打开开关，看哪个能重现“闪烁/不干脆”，就锁定了真正的元凶。
      </p>
      <div class="layout">
        <div class="controls">
          <h2>隔离开关</h2>
          ${Toggle({ k: 'dim', name: 'dim 拖拽行 (opacity 0.5)',
            desc: '旧写法：拖拽中行半透明，松手瞬间弹回不透明。无 DragOverlay 时这一下回弹是最可疑的闪烁源。' })}
          ${Toggle({ k: 'reconcile', name: '模拟后端对账重渲染 (+150ms)',
            desc: '松手 150ms 后用全新对象 ref 再 render 一次列表 —— 复刻 useReorderSort 旧的 onSuccess setQueryData。验证 shiki 的“后端刷新”假设。' })}
          ${Toggle({ k: 'settle', name: 'settle 落位动画',
            desc: '旧写法：松手后 dnd-kit 对已落位的行补一段 transform→0 动画 = 之前那个“跳一下”。当前已用守卫关掉。' })}
          <div class="log">${log}</div>
        </div>

        <div class="sidebar">
          <h2>Channels</h2>
          <${DndContext}
            sensors=${sensors}
            collisionDetection=${closestCenter}
            modifiers=${[restrictToVerticalAxis, restrictToParentElement]}
            onDragEnd=${onDragEnd}
          >
            <${SortableContext} items=${items.map((i) => i.id)} strategy=${verticalListSortingStrategy}>
              <ul class="list">
                ${items.map((item) => html`
                  <${SortableItem}
                    key=${item.id}
                    item=${item}
                    selected=${item.id === selected}
                    onSelect=${setSelected}
                    opts=${opts}
                  />`)}
              </ul>
            <//>
          <//>
        </div>
      </div>
    </div>`;
}

createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
