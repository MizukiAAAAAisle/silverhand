<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8" fill="#8c8ead"/></marker></defs><rect width="1200" height="830" fill="#f5f6f2"/><style>text{font-family:-apple-system,BlinkMacSystemFont,sans-serif;fill:#272b3b}.title{font-size:27px;font-weight:700}.small{font-size:14px;fill:#717789}.label{font-size:19px;font-weight:650}.sub{font-size:15px;fill:#626879}</style><text x="48" y="55" class="title">Silverhand 手机导航 / Chats / Activity / Tasks / More</text><text x="48" y="87" class="small">三个主区保留独立来源栈；More 仅打开菜单；workspace 是局部范围，server 才是身份边界。</text><rect x="48" y="120" width="258" height="52" rx="12" fill="#5354cb"/><text x="177" y="154" text-anchor="middle" style="fill:white;font-size:20px;font-weight:700">Chats</text><path d="M177,172V198" stroke="#8c8ead" stroke-width="1.5" marker-end="url(#a)"/><rect x="48" y="205" width="258" height="79" rx="12" fill="white" stroke="#dedfe7"/><text x="65" y="236" class="label">全部 / 收藏 / 私聊</text><text x="65" y="262" class="sub">工作区与 Agent 空间</text><path d="M177,284V310" stroke="#8c8ead" stroke-width="1.5" marker-end="url(#a)"/><rect x="48" y="317" width="258" height="79" rx="12" fill="white" stroke="#dedfe7"/><text x="65" y="348" class="label">会话内容</text><text x="65" y="374" class="sub">频道或无 workspace 的 DM</text><path d="M177,396V422" stroke="#8c8ead" stroke-width="1.5" marker-end="url(#a)"/><rect x="48" y="429" width="258" height="79" rx="12" fill="white" stroke="#dedfe7"/><text x="65" y="460" class="label">线程 / 相关内容</text><text x="65" y="486" class="sub">任务 · 附件 · 搜索</text><rect x="330" y="120" width="258" height="52" rx="12" fill="#5354cb"/><text x="459" y="154" text-anchor="middle" style="fill:white;font-size:20px;font-weight:700">Activity</text><path d="M459,172V198" stroke="#8c8ead" stroke-width="1.5" marker-end="url(#a)"/><rect x="330" y="205" width="258" height="79" rx="12" fill="white" stroke="#dedfe7"/><text x="347" y="236" class="label">全部 / @我的 / 线程</text><text x="347" y="262" class="sub">跨工作区注意力队列</text><path d="M459,284V310" stroke="#8c8ead" stroke-width="1.5" marker-end="url(#a)"/><rect x="330" y="317" width="258" height="79" rx="12" fill="white" stroke="#dedfe7"/><text x="347" y="348" class="label">消息 / 线程上下文</text><text x="347" y="374" class="sub">定位触发消息</text><path d="M459,396V422" stroke="#8c8ead" stroke-width="1.5" marker-end="url(#a)"/><rect x="330" y="429" width="258" height="79" rx="12" fill="white" stroke="#dedfe7"/><text x="347" y="460" class="label">返回动态</text><text x="347" y="486" class="sub">保留筛选与列表锚点</text><rect x="612" y="120" width="258" height="52" rx="12" fill="#5354cb"/><text x="741" y="154" text-anchor="middle" style="fill:white;font-size:20px;font-weight:700">Tasks</text><path d="M741,172V198" stroke="#8c8ead" stroke-width="1.5" marker-end="url(#a)"/><rect x="612" y="205" width="258" height="79" rx="12" fill="white" stroke="#dedfe7"/><text x="629" y="236" class="label">任务列表与筛选</text><text x="629" y="262" class="sub">归属 · 状态 · 负责人</text><path d="M741,284V310" stroke="#8c8ead" stroke-width="1.5" marker-end="url(#a)"/><rect x="612" y="317" width="258" height="79" rx="12" fill="white" stroke="#dedfe7"/><text x="629" y="348" class="label">任务详情</text><text x="629" y="374" class="sub">正文 · 状态 · 负责人</text><path d="M741,396V422" stroke="#8c8ead" stroke-width="1.5" marker-end="url(#a)"/><rect x="612" y="429" width="258" height="79" rx="12" fill="white" stroke="#dedfe7"/><text x="629" y="460" class="label">来源会话 / 线程</text><text x="629" y="486" class="sub">返回原任务详情</text><rect x="894" y="120" width="258" height="52" rx="12" fill="#5354cb"/><text x="1023" y="154" text-anchor="middle" style="fill:white;font-size:20px;font-weight:700">More ↑</text><path d="M1023,172V198" stroke="#8c8ead" stroke-width="1.5" marker-end="url(#a)"/><rect x="894" y="205" width="258" height="79" rx="12" fill="white" stroke="#dedfe7"/><text x="911" y="236" class="label">Members</text><text x="911" y="262" class="sub">Agent / 人员 / 发私聊</text><rect x="894" y="317" width="258" height="79" rx="12" fill="white" stroke="#dedfe7"/><text x="911" y="348" class="label">Computers</text><text x="911" y="374" class="sub">远程计算机详情</text><rect x="894" y="429" width="258" height="79" rx="12" fill="white" stroke="#dedfe7"/><text x="911" y="460" class="label">Settings</text><text x="911" y="486" class="sub">账号 / 外观 / 连接</text><rect x="48" y="553" width="1104" height="104" rx="16" fill="#e9eaf5"/><text x="70" y="587" class="label">More 是锚定菜单，不是第四个内容 Tab</text><text x="70" y="620" class="sub">展开或取消不改变当前页；选择后压入来源栈，返回到打开 More 前的位置。</text><text x="48" y="702" class="label">返回始终回答：我从哪里来？</text><text x="48" y="733" class="sub">搜索 → 命中 → 返回结果　·　动态 → 线程 → 返回动态　·　任务 → 来源 → 返回任务</text><text x="48" y="768" class="small">正常前后台：保留页面、草稿与发送身份；退出 / 认证失效 / 成功切 server：清理旧身份状态。</text><text x="48" y="801" class="small">设计提案 #2667 · 不代表生产功能已实现 · 细节与权限以 interaction.md 为准</text></svg>