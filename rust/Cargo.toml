[workspace]
members = [
  "crates/backend-core",
  "crates/backend-server",
  "crates/backend-sqlite",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace.dependencies]
axum = { version = "=0.8.9", features = ["json", "tokio", "ws"] }
base64 = "=0.22.1"
futures-util = "=0.3.34"
getrandom = "=0.4.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
silverhand-backend-core = { path = "crates/backend-core" }
silverhand-backend-sqlite = { path = "crates/backend-sqlite" }
sqlx = { version = "=0.9.0", default-features = false, features = ["derive", "macros", "migrate", "runtime-tokio", "sqlite"] }
tempfile = "=3.27.0"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "=0.29.0"
tower = { version = "=0.5.3", features = ["util"] }
tower-http = { version = "=0.7.0", features = ["trace"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
ts-rs = { version = "=12.0.1", features = ["serde-compat"] }
