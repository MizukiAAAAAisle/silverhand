serde_json.workspace = true
sha2.workspace = true
silverhand-backend-core.workspace = true
silverhand-backend-filesystem.workspace = true
silverhand-backend-server.workspace = true
silverhand-backend-sqlite.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
serde_json.workspace = true
syn.workspace = true
proc-macro2 = { version = "1", features = ["span-locations"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
