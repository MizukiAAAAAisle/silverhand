# electron-builder config for the silverhand desktop app.
#
# macOS-only (per CLAUDE.md). Produces a universal dmg + zip under
# `apps/desktop/release/`. Run via `pnpm package` from the repo root —
# that wrapper builds Desktop resources and the self-contained Rust sidecar.

appId: com.silverhand.desktop
productName: Silverhand
copyright: Copyright © 2026 Silverhand

directories:
  # Where electron-builder looks for icons / entitlements / dmg
  # background. Default is `build/`; spell it out for clarity.
  buildResources: build
  # Output dir for the packaged .dmg / .app / .zip artifacts.
  output: release

# Builds are owned by scripts/package.sh; Desktop has no native DB dependency.
npmRebuild: false
nodeGypRebuild: false

# Ad-hoc code signing. We have no Developer ID identity, so `mac.identity: null`
# (below) tells electron-builder's builtin signer to cleanly skip — it does NOT
# ad-hoc sign, despite older lore; see app-builder-lib macPackager.js. The
# actual ad-hoc signature is applied by this `afterPack` hook, which runs after
# the .app is assembled but before the dmg/zip are built, so the artifacts ship
# a valid bundle signature. Without it the app carries only Electron's stub
# signature (Identifier=Electron) and macOS refuses to open it. See
# scripts/afterPack.cjs.
afterPack: scripts/afterPack.cjs

# What gets included in the asar.
# - out/**: electron-vite output (main + preload + renderer)
# - package.json: electron uses "main" to find the entrypoint
# - node_modules: remaining production deps.
#   Workspace deps (@silverhand/*) are bundled by electron-vite into
#   out/main/index.js, so the symlinks in node_modules don't need to
#   resolve at runtime — and they MUST be excluded, otherwise
#   electron-builder follows them out of apps/desktop/ and bails on
#   "must be under <project>" when it hits packages/*/dist/.
files:
  - out/**/*
  - package.json
  - "!node_modules/@silverhand"
  - "!node_modules/@silverhand/**"
  - "!**/{tsconfig*.json,*.tsbuildinfo}"
  - "!**/node_modules/*/{README.md,readme.md,*.d.ts,LICENSE*,license*}"
  - "!**/node_modules/**/test/**"
  - "!node_modules/better-sqlite3/**"
  - "!node_modules/@node-rs/**"

# Ship the esbuild-bundled Silverhand CLI outside the asar so the per-spawn
# `bin/silverhand` PATH shim can forward to it through Electron's Node runtime
# (ELECTRON_RUN_AS_NODE=1). Renamed to `.mjs` so Node treats it as ESM without
# needing a sibling `package.json` type=module — the esbuild bundle is emitted
# as ESM. We used to ship a bun-compiled single-file binary here; the reusable
# Electron runtime is already in the package, so bundling a second (~60MB)
# runtime was pure overhead. See docs/build-release.md.
extraResources:
  - from: ../../packages/cli/dist/cli.js
    to: silverhand-cli/cli.mjs
  # PR-1 silverhand-daemon: Electron main spawns this bundle as a
  # child process at startup. Same `.mjs` rename trick as the CLI so
  # Node loads it as ESM without a sibling package.json. See
  # `apps/desktop/src/main/index.ts:resolveDaemonLauncher`.
  - from: ../../packages/host/dist/daemon.js
    to: silverhand-daemon/daemon.mjs
  # #task:2343 — the PREBUILT Rust backend sidecar + its manifest, built by
  # scripts/package.sh (`cargo build --release`) at PACKAGE time (never at runtime). The
  # launcher (`resolveBackendSidecarManifestPath`) reads the manifest from
  # `resources/silverhand-backend/` and `verifySidecar` checks arch + SHA-256 before
  # spawn. The embedded arm has no TS-backend fallback, so a missing/mismatched sidecar
  # fails startup loudly. (electron-builder.remote-only.yml does NOT ship these.)
  - from: ${env.SILVERHAND_BACKEND_STAGE}/silverhand-backend
    to: silverhand-backend/silverhand-backend
  - from: ${env.SILVERHAND_BACKEND_STAGE}/silverhand-backend.manifest.json
    to: silverhand-backend/silverhand-backend.manifest.json

mac:
  extendInfo:
    NSLocalNetworkUsageDescription: Silverhand connects to computers and servers on your local network to run and manage agents.
  category: public.app-category.developer-tools
  # arm64-only for now. Universal (arm64+x64) was attempted but the
  # x64 Electron zip download fails over our network — switch back
  # by adding `- universal` once that's fixed, or build x64 on a
  # machine with reliable github.com access.
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  # null = SKIP electron-builder's builtin signing (it does NOT ad-hoc sign on
  # null — it logs "skipped macOS code signing" and returns). The ad-hoc
  # signature is applied instead by the afterPack hook (see top of file). For
  # distribution, set this to a Developer ID identity and add notarization.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  icon: build/icon.icns

dmg:
  # Default window layout — fine for now; tweak when there's a custom
  # background. `sign: false` skips dmg signing (we're ad-hoc only).
  sign: false
  writeUpdateInfo: false
