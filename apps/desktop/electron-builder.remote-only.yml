# Remote-only package variant. Keep this intentionally close to
# electron-builder.yml, but exclude embedded backend/native packages
# and native unpack rules. Both profiles use the shared Node logger;
# only this profile aliases the embedded launcher to a refusing stub.

appId: com.silverhand.desktop
productName: Silverhand-remote-server
artifactName: ${productName}-${version}-${arch}.${ext}
copyright: Copyright © 2026 Silverhand

directories:
  buildResources: build
  output: release-remote-server

npmRebuild: false
nodeGypRebuild: false

afterPack: scripts/afterPack.cjs

files:
  - out/**/*
  # #task:1530 — the shipped manifest is generated at build time from the single
  # release-version SoT (apps/desktop/package.json) by scripts/package.sh; the
  # tracked package.remote-only.json intentionally carries NO version so there is
  # no second hand-maintained release version. extraMetadata does NOT rewrite this
  # rename-copy (it only touches the main package.json), so injection is why the
  # remote-only runtime app.getVersion() stays == canonical.
  - from: package.remote-only.generated.json
    to: package.json
  - "!node_modules/@silverhand"
  - "!node_modules/@silverhand/**"
  - "!node_modules/@hono"
  - "!node_modules/@hono/**"
  - "!node_modules/hono"
  - "!node_modules/hono/**"
  - "!node_modules/better-sqlite3"
  - "!node_modules/better-sqlite3/**"
  - "!node_modules/@node-rs/argon2"
  - "!node_modules/@node-rs/argon2/**"
  - "!node_modules/@node-rs/argon2-darwin-arm64"
  - "!node_modules/@node-rs/argon2-darwin-arm64/**"
  - "!**/{tsconfig*.json,*.tsbuildinfo}"
  - "!**/node_modules/*/{README.md,readme.md,*.d.ts,LICENSE*,license*}"
  - "!**/node_modules/**/test/**"

extraResources:
  - from: ../../LICENSE
    to: LICENSE
  - from: ../../packages/cli/dist/cli.js
    to: silverhand-cli/cli.mjs
  - from: ../../packages/silverhand-daemon/dist/daemon.js
    to: silverhand-daemon/daemon.mjs

mac:
  # Chromium ships ~55 UI locales (~13MB compressed); keep English and
  # Simplified Chinese. Names match the `.lproj` folders exactly, so the
  # grammatical-gender variants Chromium also loads are listed too.
  electronLanguages:
    - en
    - en_FEMININE
    - en_MASCULINE
    - en_NEUTER
    - zh_CN
    - zh_CN_FEMININE
    - zh_CN_MASCULINE
    - zh_CN_NEUTER
  extendInfo:
    NSLocalNetworkUsageDescription: Silverhand connects to computers and servers on your local network to run and manage agents.
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  # Ad-hoc by default (afterPack signs). scripts/package.sh overrides identity
  # and hardenedRuntime when SILVERHAND_MAC_SIGN_IDENTITY names a Developer ID.
  identity: null
  hardenedRuntime: false
  entitlementsInherit: build/entitlements.mac.plist
  gatekeeperAssess: false
  icon: build/icon.icns

# Update feed for scripts/package.sh Developer ID builds; ad-hoc builds drop
# app-update.yml in afterPack and therefore have no update channel. The channel
# keeps each variant on its own `remote-only-mac.yml` within the shared release.
publish:
  provider: github
  owner: stickmy
  repo: silverhand
  channel: remote-only

dmg:
  sign: false
  writeUpdateInfo: false
