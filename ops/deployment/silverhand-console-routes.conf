# Include ONLY in the existing HTTPS server {} for the ECS domain.
# Requires silverhand-console-http.conf in http {}. Preserve other API/WS routes.
location = /console/ {
    access_log /var/log/nginx/silverhand-console.access.log silverhand_console;
    return 308 /console;
}

location = /console {
    proxy_pass http://silverhand_console;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache off;
    proxy_buffering off;
    proxy_intercept_errors off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    client_max_body_size 1k;
    access_log /var/log/nginx/silverhand-console.access.log silverhand_console;
}

location ^~ /console/api/ {
    # No URI suffix: preserve /console/api/... and its bounded query parameters.
    proxy_pass http://silverhand_console;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache off;
    proxy_buffering off;
    proxy_intercept_errors off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    client_max_body_size 1k;
    access_log /var/log/nginx/silverhand-console.access.log silverhand_console;
}

# Defense at the edge as well as the Rust product listener. Never proxy 9464.
location = /metrics {
    return 403;
}
location ^~ /metrics/ {
    return 403;
}
