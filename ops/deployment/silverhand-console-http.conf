# Include in nginx's http {} context. Keep the existing product upstream address
# if the TLS edge is on a different host; do not point this at metrics port 9464.
upstream silverhand_console {
    server 127.0.0.1:8080;
}

# Intentionally no URI, query, referrer, Authorization or other client strings.
log_format silverhand_console '$time_iso8601 console $request_method $status $request_time';
